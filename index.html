/* Layout: one phone-width column, floating black dock, bottom sheets for logging. Sky blue, rose for periods, lilac for the fertile estimate. */

:root[data-theme="dark"]{

.field{width:100%;border:0;border-radius:16px;background:var(--bg);box-shadow:0 0 0 1px var(--line);color:var(--ink);font:inherit;font-size:16px;padding:12px 14px}

.ic{flex:none;width:44px;height:44px;border-radius:15px;background:var(--soft);color:var(--accent);display:flex;align-items:center;justify-content:center}.ic.rose{background:var(--period-soft);color:var(--period)}

.links{display:flex;flex-wrap:wrap;gap:6px 16px}.links a,.refs a{color:var(--accent);font-weight:650;text-decoration:none;font-size:12.5px}

.pager{display:flex;justify-content:center;gap:6px}.pager i{width:6px;height:6px;border-radius:50%;background:var(--line);transition:width .2s}.pager i.on{width:20px;border-radius:3px;background:var(--accent)}

.exportbtn{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border:0;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);color:var(--accent);font-size:13.5px;font-weight:650}

input[type=date].field{display:block;-webkit-appearance:none;appearance:none;width:100%;max-width:100%;min-width:0;min-height:50px;text-align:left;line-height:1.2}

.dock button{flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:52px;border:0;border-radius:999px;background:none;color:var(--on-dock);opacity:.72;font-size:10px;font-weight:600}

@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

function home(C){
  var d=dt(today),h=new Date().getHours();
  var greet=h<12?'Good morning':h<18?'Good afternoon':'Good evening';
  var out=header(greet,DOWL[dowOf(today)]+' '+d.getUTCDate()+' '+MONL[d.getUTCMonth()])+sampleBanner();
  // week strip
  var mon=today-dowOf(today),logged=0,wk='';
  for(var i=0;i<7;i++){var n=mon+i,has=hasLog(n);if(has)logged++;
    wk+='<button class="wd'+(n===today?' now':'')+'" data-act="log" data-d="'+n+'"'+(n>today?' disabled':'')+' aria-label="'+dm(n)+(has?', logged':'')+'"><b>'+DOW[i]+'</b><span>'+dt(n).getUTCDate()+'</span><i class="'+(has?'on':'')+'"></i></button>'}
  out+='<section class="week" aria-label="This week">'+wk+'</section>';

   '<svg width="100%" viewBox="0 0 300 156" role="img" aria-label="Day '+day+' of about '+avg+'" style="display:block;overflow:visible"><defs><radialGradient id="gl"><stop offset="0" stop-color="var(--mark)" stop-opacity=".42"/><stop offset=".55" stop-color="var(--mark)" stop-opacity=".16"/><stop offset="1" stop-color="var(--mark)" stop-opacity="0"/></radialGradient></defs><ellipse cx="150" cy="112" rx="190" ry="78" fill="url(#gl)"/><ellipse cx="92" cy="92" rx="84" ry="70" fill="url(#gl)"/><ellipse cx="208" cy="92" rx="84" ry="70" fill="url(#gl)"/>'+
   '<path d="M30 140 A120 120 0 0 1 270 140" fill="none" stroke="var(--arc)" stroke-width="14" stroke-linecap="round"/>'+
   (p>0?'<path d="M30 140 A120 120 0 0 1 '+x.toFixed(1)+' '+y.toFixed(1)+'" fill="none" stroke="var(--mark)" stroke-width="14" stroke-linecap="round"/>':'')+
   '<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="14" fill="#fff" stroke="var(--mark)" stroke-width="3"/></svg>'+
   '<div style="position:absolute;left:0;right:0;bottom:4px;display:flex;flex-direction:column;align-items:center"><div class="num" style="font-size:42px;line-height:1">Day '+day+'</div><div class="muted" style="font-size:13px;margin-top:4px">of about '+avg+'</div></div></div></section>';
  // next period
  if(C.win){var tg=C.center-today;
    out+='<section class="card" aria-label="Next period"><span class="badge">'+ico('clock',14,2.2)+'Next period likely '+rng(C.win[0],C.win[1],true)+'</span>'+
    '<div class="num" style="font-size:28px;line-height:1.15;margin-top:12px">'+(tg>1?'About '+tg+' days to go':tg===1?'About 1 day to go':tg===0?'Expected around today':'Running '+(-tg)+' days past the middle of the window')+'</div>'+
    '<p class="hint">'+(C.st.n?'From your last '+C.st.n+' cycle'+(C.st.n>1?'s':'')+'. '+C.conf+' confidence.':'Based on a typical 28 day cycle until you add more. Low confidence.')+'</p></section>'}

  '<div class="tile"><div class="k"><i style="width:16px;height:9px;border-radius:4px;border:1.5px dashed var(--period)"></i>Next period</div><div class="v">'+(C.win?rng(C.win[0],C.win[1]):'Not yet')+'</div></div>'+
  '<div class="tile"><div class="k"><i style="width:9px;height:9px;border-radius:50%;background:var(--good)"></i>Days logged</div><div class="v">'+logged+' this week</div></div>'+
  '<div class="tile"><div class="k"><i style="width:11px;height:11px;border-radius:50%;background:var(--ink)"></i>Today</div><div class="v">Day '+day+' of about '+avg+'</div></div></section>';
  if(C.fert){var inside=today>=C.fert[0]&&today<=C.fert[1];
    out+='<div class="tile" style="display:block"><div class="k"><i style="width:16px;height:9px;border-radius:4px;background:var(--lilac);box-shadow:0 0 0 1px var(--lilac-ink)"></i>Estimated fertile window</div><div class="v">'+rng(C.fert[0],C.fert[1])+(inside?' · today is inside it':'')+'</div></div>'+

function calendar(C){

  for(var i=0;i<7;i++)h+='<div class="w">'+DOW[i]+'</div>';
  for(var c=0;c<cells;c++){var n=first-lead+c,dd=dt(n),out=dd.getUTCMonth()!==cm.m,cls='d';

    if(n===today)cls+=' t';
    if(hasLog(n))cls+=' l';
    h+='<button class="'+cls+'" data-act="log" data-d="'+n+'"'+(n>today?' disabled':'')+' aria-label="'+dm(n)+'"><span>'+dd.getUTCDate()+'</span></button>'}
  return h+'</div></section>'}

function periodsTab(C){
  var out=header('Periods',C.P.length?C.P.length+' logged':'Nothing logged yet')+sampleBanner();
  if(!C.P.length)return out+emptyState()+backup();
  // length chart
  var ps=C.P.filter(function(p){return p.end}).slice(-6);
  if(ps.length){
    var avg=mean(ps.map(function(p){return N(p.end)-N(p.start)+1})),lo=Infinity,hi=0,b='';
    ps.forEach(function(p){var l=N(p.end)-N(p.start)+1;lo=Math.min(lo,l);hi=Math.max(hi,l)});
    ps.forEach(function(p,i){var l=N(p.end)-N(p.start)+1,last=i===ps.length-1;
      b+='<div style="display:flex;flex-direction:column;align-items:center;gap:3px"><span style="font-size:12px;font-weight:'+(last?700:650)+'">'+l+'</span><i style="display:block;width:100%;max-width:32px;height:'+(l*8)+'px;border-radius:8px 8px 3px 3px;background:var(--period);opacity:'+(last?1:.55)+'"></i><span style="font-size:10.5px;color:'+(last?'var(--ink)':'var(--muted)')+'">'+MON[dt(N(p.start)).getUTCMonth()]+'</span></div>'});
    out+='<section class="card" aria-label="Period length"><div style="display:flex;justify-content:space-between;align-items:flex-start"><div><h2>Period length</h2><div class="hint" style="margin-top:2px">Days of bleeding, last '+ps.length+'</div></div><div style="text-align:right"><div style="display:flex;align-items:baseline;gap:4px;justify-content:flex-end"><span class="num" style="font-size:30px;line-height:1">'+Math.round(avg*10)/10+'</span><span class="muted" style="font-size:12.5px">days avg</span></div><div class="hint" style="margin-top:2px">range '+lo+' to '+hi+'</div></div></div>'+
    '<div style="display:grid;grid-template-columns:repeat('+ps.length+',minmax(0,1fr));gap:10px;align-items:end;margin-top:12px;height:'+(hi*8+36)+'px">'+b+'</div></section>'}
  out+='<div style="display:flex;justify-content:space-between;align-items:baseline;padding:4px 4px 0"><h2 style="font-size:15px;font-weight:650">History</h2><span class="muted" style="font-size:12px">Newest first · tap to edit</span></div><div style="display:flex;flex-direction:column;gap:8px">';
  var list=C.P.slice().reverse(),LIM=5,shown=ui.histAll?list:list.slice(0,LIM);
  shown.forEach(function(p,i){var a=N(p.start),idx=C.P.indexOf(p),prev=idx>0?a-N(C.P[idx-1].start):null,d=dt(a);
    out+='<button class="row" data-act="editP" data-id="'+esc(p.id||'')+'" data-i="'+idx+'"><span class="dateb"><span class="a">'+d.getUTCDate()+'</span><span class="b">'+MON[d.getUTCMonth()].toUpperCase()+'</span></span><span style="flex:1 1 auto;min-width:0"><span style="display:block;font-size:15px;font-weight:650">'+(p.end?rng(a,N(p.end)):dm(a)+' – ongoing')+' '+d.getUTCFullYear()+'</span><span class="muted" style="display:block;font-size:12px;margin-top:1px">'+(prev?prev+' days after the one before':'First one logged')+'</span></span>'+(p.end?'<span class="pill2">'+(N(p.end)-a+1)+' days</span>':'<span class="pill2">Now</span>')+'</button>'});
  out+='</div>';
  if(list.length>LIM)out+='<button class="seeall" data-act="hist" aria-expanded="'+ui.histAll+'">'+(ui.histAll?'Show fewer':'See all '+list.length)+'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform:rotate('+(ui.histAll?'-90':'90')+'deg)"><path d="M9 6l6 6-6 6"/></svg></button>';
  out+='<button class="btn soft" data-act="openAdd">'+ico('plus',18,2.2)+'Add past periods</button>';
  out+=cycleSync(C)+backup();

var SRC=[
 ['McNulty KL et al. The effects of menstrual cycle phase on exercise performance in eumenorrheic women: a systematic review and meta-analysis. <i>Sports Medicine</i>, 2020.','https://nrl.northumbria.ac.uk/id/eprint/43759'],

function cycleSync(C){
  var s=stage(C),names={menstrual:'Menstrual stage',follicular:'Follicular stage',ovulation:'Around ovulation',luteal:'Luteal stage'};
  var nu={menstrual:'iron-rich foods such as lentils, beans, leafy greens or lean red meat, with vitamin C to help absorption.',follicular:'lean protein, whole grains, leafy greens and other vegetables.',ovulation:'fibre-rich vegetables, fruit and plenty of fluids.',luteal:'complex carbohydrates, magnesium-rich foods such as nuts and seeds, and regular meals.'};
  var ex={menstrual:'gentle movement such as walking or stretching, if you feel like it.',follicular:'higher-intensity sessions such as running, cycling, swimming or heavier lifting are commonly suggested. Go by how you feel.',ovulation:'higher-intensity sessions are commonly suggested. Go by how you feel.',luteal:'steady, moderate sessions such as walking, Pilates or lighter strength work.'};
  var loveOn=s==='follicular'||s==='ovulation';
  var h='<div style="padding:10px 4px 0"><h2 class="serif" style="font-size:24px">Cycle sync</h2><div class="hint" style="font-size:13px;margin-top:3px">'+(s?'Ideas for today, day '+C.day+' of about '+Math.round(C.st.avg)+'. '+names[s]+', an estimate.':'Add a period to see ideas for today.')+'</div></div>'+
  '<section class="card cs" style="background:var(--soft);box-shadow:none"><h3 style="font-size:15px;font-weight:650">Read this first</h3><p>Cycle syncing means adjusting food, exercise and routines to your cycle phase. It is popular, but research that tests it directly is limited. Treat these as ideas to try and notice, not rules.</p><p class="ev">Hormonal birth control changes the cycle, so phases may not apply. See a doctor about irregular, very heavy or painful periods.</p><div class="links" style="margin-top:12px">'+lk('WebMD overview','https://www.webmd.com/women/cycle-syncing')+lk('Medical News Today','https://www.medicalnewstoday.com/articles/cycle-syncing')+'</div></section>';
  h+='<div class="rail" id="rail" role="region" aria-label="Cycle sync ideas, swipe for more" tabindex="0">';
  h+='<section class="card cs slide"><div class="cs-h"><span class="ic">'+ico('leaf',22)+'</span><div><h3>Nutrients</h3><div class="st">Food and iron</div></div></div><p><b>Worth trying today:</b> '+(s?nu[s]:nu.follicular)+'</p><p class="ev"><b>What research says:</b> there is no research-backed food plan for each phase. Iron is the exception. Heavy periods raise the risk of falling short, women 19 to 50 need 18 mg a day, and plant iron is absorbed better with vitamin C.</p><div class="links">'+lk('NIH iron fact sheet','https://ods.od.nih.gov/factsheets/Iron-Consumer/')+lk('WebMD','https://www.webmd.com/women/cycle-syncing')+'</div></section>';
  h+='<section class="card cs slide"><div class="cs-h"><span class="ic">'+ico('dumb',22)+'</span><div><h3>Exercise</h3><div class="st">Training and energy</div></div></div><p><b>Worth trying today:</b> '+(s?ex[s]:ex.follicular)+'</p><p class="ev"><b>What research says:</b> a 2020 meta-analysis found performance may be slightly lower in the early follicular phase, but the effect is small and the evidence quality low. The authors advise tracking how you respond across your own cycle rather than following a general rule.</p><div class="links">'+lk('McNulty et al., 2020','https://nrl.northumbria.ac.uk/id/eprint/43759')+lk('WebMD','https://www.webmd.com/women/cycle-syncing')+'</div></section>';
  h+='<section class="card cs slide"><div class="cs-h"><span class="ic">'+ico('focus',22)+'</span><div><h3>Focus</h3><div class="st">Attention and memory</div></div></div><p><b>Worth trying today:</b> no cycle stage is reliably better for focus. Plan your work around your own energy, and note how your concentration feels in your daily log.</p><p class="ev"><b>What research says:</b> a 2025 meta-analysis of 102 studies found no robust change in attention, executive function or memory across the cycle. Medical News Today adds that productivity claims tied to phases lack scientific support.</p><div class="links">'+lk('Jang et al., 2025','https://pmc.ncbi.nlm.nih.gov/articles/PMC11913300')+lk('Medical News Today','https://www.medicalnewstoday.com/articles/cycle-syncing')+'</div></section>';
  h+='<section class="card cs slide"><div class="cs-h"><span class="ic rose">'+ico('heart',22)+'</span><div><h3>Love</h3><div class="st">Desire and connection</div></div></div><p><b>Worth noticing today:</b> '+(loveOn?'sexual desire may rise around ovulation for some people, so the next few days could feel more connected. Plan around what you notice, not a calendar.':'desire varies by person and by day. Notice what you feel instead of following a calendar.')+'</p><p class="ev"><b>What research says:</b> higher estradiol is linked to more daily sexual desire and higher progesterone, after ovulation, to less. Individual differences are large, and this is not a way to plan or prevent pregnancy.</p><div class="links">'+lk('Roney, 2015','https://link.springer.com/doi/10.1007/978-3-319-09384-0_6')+lk('WebMD','https://www.webmd.com/women/cycle-syncing')+'</div></section></div>';

function insights(C){

   t('Within ±2',st.n?within:'–','%','of avg days')+'</section>';
  // history dots
  var row=function(done,per,start,fw){var tot=Math.max(30,done),s='';for(var i=0;i<tot;i++){var inF=fw&&i>=per&&start+i>=fw[0]&&start+i<=fw[1];s+='<i class="dot '+(i<per?'p':inF?'fw':i<done?'c':'r')+'"></i>'}return s};
  var cur=C.day,curP=C.P.length?Math.round(C.avgP):5,lastC=C.cycles.length?C.cycles[C.cycles.length-1]:null;
  var curPer=C.P.length&&C.P[C.P.length-1].end?N(C.P[C.P.length-1].end)-C.last+1:curP;

function pdfText(s){var o='';for(var i=0;i<s.length;i++){var c=s.charCodeAt(i),ch=s.charAt(i);
  if(ch==='('||ch===')'||ch==='\\')o+='\\'+ch;else if(c>=32&&c<127)o+=ch;else if(c===177)o+='\\261';else if(c===183)o+='\\267';else if(c===8211)o+='\\226';else o+='?'}return o}

function Pdf(){
  var W=841.89,H=595.28,ops=[],K=.5523;

  var rgb=function(h){return f(parseInt(h.slice(1,3),16)/255)+' '+f(parseInt(h.slice(3,5),16)/255)+' '+f(parseInt(h.slice(5,7),16)/255)};
  var P={
    rrect:function(x,y,w,h,r,fill,stroke,lw){r=Math.min(r,w/2,h/2);var X=x,Y=H-y-h,k=r*K,o='';
      o+=f(X+r)+' '+f(Y)+' m '+f(X+w-r)+' '+f(Y)+' l '+f(X+w-r+k)+' '+f(Y)+' '+f(X+w)+' '+f(Y+r-k)+' '+f(X+w)+' '+f(Y+r)+' c ';
      o+=f(X+w)+' '+f(Y+h-r)+' l '+f(X+w)+' '+f(Y+h-r+k)+' '+f(X+w-r+k)+' '+f(Y+h)+' '+f(X+w-r)+' '+f(Y+h)+' c ';
      o+=f(X+r)+' '+f(Y+h)+' l '+f(X+r-k)+' '+f(Y+h)+' '+f(X)+' '+f(Y+h-r+k)+' '+f(X)+' '+f(Y+h-r)+' c ';
      o+=f(X)+' '+f(Y+r)+' l '+f(X)+' '+f(Y+r-k)+' '+f(X+r-k)+' '+f(Y)+' '+f(X+r)+' '+f(Y)+' c h';
      ops.push('q '+(fill?rgb(fill)+' rg ':'')+(stroke?rgb(stroke)+' RG '+f(lw||.8)+' w ':'')+o+' '+(fill&&stroke?'B':fill?'f':'S')+' Q')},
    rect:function(x,y,w,h,fill){ops.push('q '+rgb(fill)+' rg '+f(x)+' '+f(H-y-h)+' '+f(w)+' '+f(h)+' re f Q')},
    line:function(x1,y1,x2,y2,col,lw,dash){ops.push('q '+rgb(col)+' RG '+f(lw||.6)+' w '+(dash?'['+dash+'] 0 d ':'')+f(x1)+' '+f(H-y1)+' m '+f(x2)+' '+f(H-y2)+' l S Q')},
    poly:function(pts,col,lw){var o=pts.map(function(p,i){return f(p[0])+' '+f(H-p[1])+(i?' l':' m')}).join(' ');ops.push('q '+rgb(col)+' RG '+f(lw)+' w 1 j 1 J '+o+' S Q')},
    circle:function(cx,cy,r,fill,stroke,lw){var k=r*K,x=cx,y=H-cy,o=f(x+r)+' '+f(y)+' m '+f(x+r)+' '+f(y+k)+' '+f(x+k)+' '+f(y+r)+' '+f(x)+' '+f(y+r)+' c '+f(x-k)+' '+f(y+r)+' '+f(x-r)+' '+f(y+k)+' '+f(x-r)+' '+f(y)+' c '+f(x-r)+' '+f(y-k)+' '+f(x-k)+' '+f(y-r)+' '+f(x)+' '+f(y-r)+' c '+f(x+k)+' '+f(y-r)+' '+f(x+r)+' '+f(y-k)+' '+f(x+r)+' '+f(y)+' c h';
      ops.push('q '+(fill?rgb(fill)+' rg ':'')+(stroke?rgb(stroke)+' RG '+f(lw||.8)+' w ':'')+o+' '+(fill&&stroke?'B':fill?'f':'S')+' Q')},
    text:function(s,x,y,size,font,col,align){var w=tw(s,size,font);if(align==='c')x-=w/2;else if(align==='r')x-=w;ops.push('BT /'+font+' '+f(size)+' Tf '+rgb(col)+' rg '+f(x)+' '+f(H-y)+' Td ('+pdfText(s)+') Tj ET')},

      o[3]='<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+W+' '+H+'] /Resources << /Font << /F1 5 0 R /F2 6 0 R /F3 7 0 R >> >> /Contents 4 0 R >>';

      var u=new Uint8Array(out.length);for(i=0;i<out.length;i++)u[i]=out.charCodeAt(i)&255;return u}
  };
  P.W=W;P.H=H;return P}

function reportData(C,key){
  var span=key==='12m'?365:key==='3y'?1096:99999,since=today-span;
  var cy=C.good.filter(function(c){return c.start>=since});
  var lens=cy.map(function(c){return c.len});
  var d={key:key,cy:cy,lens:lens,n:cy.length,span:span};
  if(cy.length<2)return d;
  d.avg=mean(lens);d.sd=sdev(lens);d.min=Math.min.apply(null,lens);d.max=Math.max.apply(null,lens);
  d.within=Math.round(100*lens.filter(function(l){return Math.abs(l-d.avg)<=2}).length/lens.length);
  d.pl=C.P.filter(function(p){return p.end&&N(p.start)>=since}).map(function(p){return N(p.end)-N(p.start)+1}).filter(function(x){return x>0&&x<=14});
  var days=Object.keys(db.logs).map(function(k){return {n:N(k),l:db.logs[k]}}).filter(function(x){return x.n>=since});
  var cnt={};days.forEach(function(x){(x.l.symptoms||[]).forEach(function(s){cnt[s]=(cnt[s]||0)+1})});
  d.top=Object.keys(cnt).sort(function(a,b){return cnt[b]-cnt[a]})[0]||null;
  d.loggedDays=days.length;
  d.hits={};d.logged={};
  if(d.top)days.forEach(function(x){var st=null;for(var i=C.starts.length-1;i>=0;i--){if(C.starts[i]<=x.n){st=C.starts[i];break}}if(st==null)return;var cd=x.n-st+1;if(cd>35)return;d.logged[cd]=(d.logged[cd]||0)+1;if((x.l.symptoms||[]).indexOf(d.top)>=0)d.hits[cd]=(d.hits[cd]||0)+1});
  var sp=key==='12m'?183:365,all=Object.keys(db.logs).map(function(k){return {n:N(k),l:db.logs[k]}});
  var A=all.filter(function(x){return x.n>today-2*sp&&x.n<=today-sp}),B=all.filter(function(x){return x.n>today-sp});
  d.sp=sp;d.chg=[];d.nA=A.length;d.nB=B.length;
  if(A.length>=10&&B.length>=10){
    var ta={};all.forEach(function(x){(x.l.symptoms||[]).forEach(function(s){ta[s]=(ta[s]||0)+1})});
    Object.keys(ta).sort(function(a,b){return ta[b]-ta[a]}).slice(0,4).forEach(function(s){
      var fa=A.filter(function(x){return (x.l.symptoms||[]).indexOf(s)>=0}).length/A.length*100,fb=B.filter(function(x){return (x.l.symptoms||[]).indexOf(s)>=0}).length/B.length*100;
      d.chg.push({s:s,a:Math.round(fa),b:Math.round(fb)})})}
  return d}

function makeReport(C,key){
  var d=reportData(C,key),P=Pdf(),INK='#0f1e36',MUT='#55657a',LINE='#dce6ef',MARK='#38a9de',PER='#c8265a',LIL='#e6dcfb',SOFT='#e0f2fe',ACC='#0369a1';
  var rangeName=key==='12m'?'Last 12 months':key==='3y'?'Last 3 years':'All time';
  P.text('Cycle report',28,56,30,'F3',INK);
  P.text(rangeName+(d.n?' · '+d.n+' cycles'+' · '+dm(d.cy[0].start)+' '+dt(d.cy[0].start).getUTCFullYear()+' to '+dm(C.last)+' '+dt(C.last).getUTCFullYear():''),28,74,10,'F1',MUT);
  P.text('Generated '+dmy(today),W_R(),44,9,'F1',MUT,'r');
  if(db.sample)P.text('Sample data, not a real person',W_R(),56,9,'F2',PER,'r');
  function W_R(){return P.W-28}
  P.rrect(28,90,786,262,12,'#ffffff',LINE,.8);
  if(d.n<2){P.text('Not enough cycles in this range yet.',48,130,14,'F2',INK);P.text('Add at least three periods to build a report.',48,150,11,'F1',MUT);return finish()}
  // title + KPIs
  P.text('Your last '+d.n+' cycles',46,114,12,'F2',INK);
  P.text('Top of each column is day 1. Rose: period. Lilac: estimated fertile days. Blue: other days.',46,128,8.5,'F1',MUT);
  var k=[['AVG CYCLE',fix1(d.avg)+' d',INK],['AVG PERIOD',d.pl.length?fix1(mean(d.pl))+' d':'-',INK],['REGULARITY','± '+fix1(d.sd)+' d',INK],['NEXT PERIOD',C.win?rng(C.win[0],C.win[1],true):'-',PER]];
  var kx=[520,596,676,796];
  k.forEach(function(it,i){P.text(it[0],kx[i],108,7.5,'F2',MUT,'r');P.text(it[1],kx[i],130,17,'F3',it[2],'r')});
  // bars
  var n=d.n,x0=46,x1=796,y0=150,y1=322,bw=(x1-x0)/n,gap=Math.min(5,bw*.2),mx=Math.max(d.max,Math.max.apply(null,d.lens)),sc=(y1-y0-12)/mx;
  d.cy.forEach(function(c,i){var x=x0+i*bw,w=bw-gap,h=c.len*sc,pl=c.p.end?N(c.p.end)-N(c.p.start)+1:5;
    P.rrect(x,y0+12,w,h,Math.min(3,w/2),SOFT);
    var fs=(c.len-18)*sc,fe=(c.len-13)*sc;P.rect(x,y0+12+fs,w,fe-fs,LIL);
    P.rrect(x,y0+12,w,pl*sc,Math.min(3,w/2),PER);
    if(n<=18)P.text(String(c.len),x+w/2,y0+8,8,'F2',INK,'c');
    var ev=Math.max(1,Math.ceil(n/12));if(i%ev===0){var dd=dt(c.start);P.text(MON[dd.getUTCMonth()]+(n>12?" '"+String(dd.getUTCFullYear()).slice(2):''),x+w/2,y1+22,7.5,'F1',MUT,'c')}});
  // panels
  var py=362,ph=184;
  P.rrect(28,py,290,ph,12,'#ffffff',LINE,.8);P.rrect(326,py,250,ph,12,'#ffffff',LINE,.8);P.rrect(584,py,230,ph,12,'#ffffff',LINE,.8);
  // stability
  P.text('Cycle stability',42,py+22,11,'F2',INK);P.text('Average ± 1 SD',42,py+35,8,'F1',MUT);
  var lo=Math.floor(Math.min(d.min,d.avg-d.sd)-1),hi=Math.ceil(Math.max(d.max,d.avg+d.sd)+1);if(hi-lo<4)hi=lo+4;var mid=Math.round((lo+hi)/2);
  var cx0=70,cx1=304,cy0=py+50,cy1=py+ph-26,Y=function(v){return cy1-(v-lo)/(hi-lo)*(cy1-cy0)},X=function(i){return n===1?(cx0+cx1)/2:cx0+i*(cx1-cx0)/(n-1)};
  [lo,mid,hi].forEach(function(v){P.line(cx0,Y(v),cx1,Y(v),LINE,.5);P.text(String(v),cx0-6,Y(v)+3,7.5,'F1',MUT,'r')});
  P.rect(cx0,Y(d.avg+d.sd),cx1-cx0,Math.max(1,Y(d.avg-d.sd)-Y(d.avg+d.sd)),'#e3f1fa');
  P.line(cx0,Y(d.avg),cx1,Y(d.avg),MARK,.8,'3 3');
  P.poly(d.lens.map(function(v,i){return [X(i),Y(v)]}),MARK,1.4);
  if(n<=30)d.lens.forEach(function(v,i){P.circle(X(i),Y(v),n>20?1.6:2.4,MARK,'#ffffff',.6)});
  var ev2=Math.max(1,Math.ceil(n/6));d.cy.forEach(function(c,i){if(i%ev2===0){var dd=dt(c.start);P.text(MON[dd.getUTCMonth()]+" '"+String(dd.getUTCFullYear()).slice(2),X(i),cy1+14,7,'F1',MUT,'c')}});
  // by day
  P.text(d.top?d.top+' by cycle day':'By cycle day',340,py+22,11,'F2',INK);
  if(d.top){
    var bx0=364,bx1=564,by0=py+48,by1=py+ph-36,bwid=(bx1-bx0)/35,uP=Math.round(C.avgP);
    P.text('Share of logged days, day 1 is the first day of a period',340,py+35,8,'F1',MUT);
    P.rect(bx0,by0,bwid*uP,by1-by0,'#fce7f3');
    [0,50,100].forEach(function(v){var yy=by1-v/100*(by1-by0);P.line(bx0,yy,bx1,yy,LINE,.5);P.text(v+'%',bx0-5,yy+3,7,'F1',MUT,'r')});
    var best=null;
    for(var dd2=1;dd2<=35;dd2++){if(!d.hits[dd2])continue;var fr=d.hits[dd2]/d.logged[dd2],bh=fr*(by1-by0);P.rrect(bx0+(dd2-1)*bwid+.6,by1-bh,bwid-1.2,bh,1,d.logged[dd2]<3?'#a9d9f0':MARK);if(d.logged[dd2]>=3&&(!best||fr>best.f))best={d:dd2,f:fr,h:d.hits[dd2],l:d.logged[dd2]}}
    [1,7,14,21,28,35].forEach(function(v){P.text(String(v),bx0+(v-1)*bwid+bwid/2,by1+12,7,'F1',MUT,'c')});
    if(best)P.text('Most often on day '+best.d+': '+best.h+' of '+best.l+' logged days ('+Math.round(best.f*100)+'%)',340,py+ph-8,8,'F2',INK)}
  else P.text('No symptoms logged in this range.',340,py+60,9,'F1',MUT);
  // what changed
  P.text('What changed',598,py+22,11,'F2',INK);
  P.text(key==='12m'?'Latest 6 months vs the 6 before':'Latest 12 months vs the 12 before',598,py+35,8,'F1',MUT);
  if(d.chg.length){d.chg.forEach(function(c,i){var yy=py+62+i*28,df=c.b-c.a;P.text(c.s,598,yy,10,'F2',INK);P.text(c.a+'% to '+c.b+'%',598,yy+12,8.5,'F1',MUT);P.text(df===0?'no change':(df>0?'+':'-')+Math.abs(df)+' pts',800,yy,10,'F2',INK,'r')});
    P.text('Share of logged days',598,py+ph-8,7.5,'F1',MUT)}
  else{P.text('Needs at least 10 logged days',598,py+66,9,'F1',MUT);P.text('in each period to compare.',598,py+78,9,'F1',MUT)}
  return finish();
  function finish(){
    P.line(28,562,814,562,LINE,.6);
    P.text('Counts and averages of what was logged. Not medical advice. Fertile days are an estimate, not a way to avoid pregnancy.',28,577,7.5,'F1',MUT);
    P.text('Period · made on this device',814,577,7.5,'F1',MUT,'r');
    return P.bytes('Period cycle report')}
}

function reportSheet(C){
  var ranges=[['12m','12 months'],['3y','3 years'],['all','All time']],k=ui.rrange,d=reportData(C,k);
  var info=d.n<2?'Not enough cycles in this range yet. Add at least three periods.':d.n+' cycles from '+dmy(d.cy[0].start)+' to '+dmy(C.last)+'.';
  return '<div class="grab"></div><div class="hd" style="min-height:48px"><div><h1>Export report</h1><div class="sub">One page, landscape PDF</div></div><button class="iconbtn" style="background:var(--surface);box-shadow:var(--shadow);width:42px;height:42px" data-act="close" aria-label="Close">'+ico('close')+'</button></div>'+
  '<section class="card" style="padding:16px"><h2>Time range</h2><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">'+ranges.map(function(r){return '<button class="chip'+(r[0]===k?' on':'')+'" data-act="rrange" data-v="'+r[0]+'" aria-pressed="'+(r[0]===k)+'">'+r[1]+'</button>'}).join('')+'</div><p class="hint" style="margin-top:12px">'+info+'</p></section>'+
  '<section class="card" style="padding:16px"><h2>What is included</h2><p class="hint" style="font-size:13px">Cycle timeline, averages, regularity, the next period estimate, cycle stability, your most logged symptom by day of the cycle, and symptom changes. Notes are never included.</p></section>'+

function makeSample(){
  var base=[29,28,27,30,28,28,29,27,28,31,28,26,28],pb=[5,5,5,4,6,5,5,4,5,6,5,5],lens=[],pls=[],last=today-12,starts=[last],i;for(i=0;i<26;i++){lens.push(base[i%base.length]);}for(i=0;i<27;i++){pls.push(pb[i%pb.length]);}
  for(i=lens.length-1;i>=0;i--)starts.unshift(starts[0]-lens[i]);
  db={periods:[],logs:{},custom:[],sample:true};
  starts.forEach(function(s,k){db.periods.push({id:uid(),start:S(s),end:S(s+pls[k]-1)})});
  var seed=7,rnd=function(){seed=(seed*9301+49297)%233280;return seed/233280};
  var fl=['heavy','medium','medium','light','light','spotting'];
  for(var d=starts[0];d<=today;d++){
    var cs=starts[0],k=0;starts.forEach(function(s,q){if(s<=d){cs=s;k=q}});
    var cd=d-cs+1,e={};
    if(cd<=pls[k])e.flow=fl[cd-1]||'light';
    var sy=[];
    if(cd<=3&&rnd()<.7)sy.push('Cramps');
    if(cd>=23&&rnd()<.45)sy.push('Bloating');
    if(rnd()<.08)sy.push('Headache');
    if(cd<=2&&rnd()<.5)sy.push('Fatigue');
    if(sy.length)e.symptoms=sy;
    if(e.flow||sy.length||rnd()<.3){if(rnd()<.6)e.mood=3+Math.floor(rnd()*3);if(Object.keys(e).length)db.logs[S(d)]=e}}
  save()}

load();render();

})();
